<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="欧几里得《几何原本》第一卷：定义、公设、公理与 48 个命题，可拖动的尺规作图和逐步证明动画。">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>几何原本 · 卷一</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,800;1,400;1,500&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: book index on the left, a figure "plate" beside its proof, colored after Byrne's 1847 Euclid (red, yellow, blue on paper). */
:root {
  --paper: #f7f7f3;
  --plate: #ffffff;
  --ink: #1d2027;
  --muted: #6b6f78;
  --rule: #dcddd6;
  --soft: #eeefe9;
  --red: #c4262e;
  --blue: #1f5aa6;
  --yellow: #d9a514;
  --aux: #a9adb4;
  --f-red: rgba(196, 38, 46, .22);
  --f-blue: rgba(31, 90, 166, .22);
  --f-yel: rgba(217, 165, 20, .30);
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --latin: "EB Garamond", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171b; --plate: #1c1f25; --ink: #e8e6df; --muted: #9a9ea6; --rule: #30343c; --soft: #252930;
    --red: #ec5a5f; --blue: #6b9be0; --yellow: #f0c040; --aux: #5d626b;
    --f-red: rgba(236, 90, 95, .25); --f-blue: rgba(107, 155, 224, .25); --f-yel: rgba(240, 192, 64, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15171b; --plate: #1c1f25; --ink: #e8e6df; --muted: #9a9ea6; --rule: #30343c; --soft: #252930;
  --red: #ec5a5f; --blue: #6b9be0; --yellow: #f0c040; --aux: #5d626b;
  --f-red: rgba(236, 90, 95, .25); --f-blue: rgba(107, 155, 224, .25); --f-yel: rgba(240, 192, 64, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 15px; line-height: 1.75; }
var, .lt { font-family: var(--latin); font-style: italic; font-size: 1.12em; }
/* each figure name is its own bidi run, so "CA، CB" reads in order inside Arabic text */
var { unicode-bidi: isolate; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.top { border-bottom: 1px solid var(--rule); padding-block: 18px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .08em; }
.top h1 .accent { color: var(--red); }
.langsel { margin-inline-start: auto; align-self: center; font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--plate); color: var(--ink); }
.top p { margin: 0; color: var(--muted); font-size: 13px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 28px; }
nav { border-inline-end: 1px solid var(--rule); padding-block: 18px 40px; padding-inline-end: 12px; max-height: calc(100vh - 70px); overflow-y: auto; position: sticky; top: env(safe-area-inset-top, 0px); }
nav h2 { font-size: 12px; letter-spacing: .2em; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
nav h2:first-child { margin-top: 0; }
nav a { display: grid; grid-template-columns: 30px 1fr; gap: 4px; color: var(--ink); text-decoration: none; padding: 3px 8px; border-radius: 4px; font-size: 13.5px; line-height: 1.5; }
nav a:hover { background: var(--soft); }
nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
nav a .n { font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--muted); }
nav a[aria-current="page"] .n { color: var(--paper); opacity: .7; }
nav a.live .t::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-inline-start: 6px; vertical-align: middle; }
nav a .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navsel { display: none; }

main { padding-block: 22px 60px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--muted); margin: 0 0 4px; }
.eyebrow .kind { color: var(--red); }
.stmt { font-size: 21px; font-weight: 600; line-height: 1.6; margin: 0 0 18px; max-width: 40em; text-wrap: balance; }

.prop { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.plate { background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
.plate svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint { font-size: 12.5px; color: var(--muted); padding: 6px 4px 0; }
.controls { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--plate); padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.count { margin-inline-start: auto; font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--muted); }

ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 8px 10px; border-radius: 5px; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; }
ol.steps li::before { content: counter(s); font-family: var(--latin); color: var(--aux); font-size: 15px; }
ol.steps li.done { color: var(--ink); }
ol.steps li.cur { background: var(--soft); color: var(--ink); }
ol.steps li.cur::before { color: var(--red); font-weight: 500; }
ol.steps li:hover:not(.cur) { background: color-mix(in srgb, var(--soft) 55%, transparent); }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; color: var(--muted); background: var(--plate); }
.quote { display: none; font-size: 13px; color: var(--muted); border-inline-start: 2px solid var(--yellow); padding-inline-start: 10px; margin-top: 6px; }
li.cur .quote { display: block; }
.qed { margin-top: 14px; font-size: 13px; color: var(--muted); letter-spacing: .1em; }

/* figure styling */
.fig .s { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.2; }
.s-ink { stroke: var(--ink); } .s-red { stroke: var(--red); } .s-blue { stroke: var(--blue); } .s-yel { stroke: var(--yellow); }
.s-aux { stroke: var(--aux); stroke-width: 1.3 !important; }
.fig .s.hl { stroke-width: 4.4; }
.f-red { fill: var(--f-red); } .f-blue { fill: var(--f-blue); } .f-yel { fill: var(--f-yel); }
.fig .ang { stroke-width: 1.6; }
.fig .pt { fill: var(--ink); }
.fig .pt.drag { fill: var(--plate); stroke: var(--red); stroke-width: 2.5; cursor: grab; }
.fig .pt.hl { fill: var(--red); }
.fig .hit { fill: transparent; cursor: grab; }
.fig .lab { font-family: var(--latin); font-style: italic; font-size: 21px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke: var(--plate); stroke-width: 4px; }
.fig .preview { stroke: var(--red); stroke-dasharray: 5 5; stroke-width: 1.4; fill: none; pointer-events: none; }
.fig .snap { fill: none; stroke: var(--red); stroke-width: 1.6; pointer-events: none; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease forwards; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.pulse { animation: pulse 1.2s ease 1; }
@keyframes pulse { 0%, 100% { opacity: 1; } 40% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .draw, .fade, .pulse { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; } }

/* intro + placeholders */
.prose { max-width: 44em; }
.prose h2 { font-size: 19px; margin: 30px 0 4px; font-weight: 900; letter-spacing: .06em; }
.prose h2:first-of-type { margin-top: 6px; }
.prose .sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.deflist { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.deflist li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--soft); }
.deflist .n { font-family: var(--latin); color: var(--red); font-variant-numeric: tabular-nums; }
.todo { border: 1px dashed var(--rule); border-radius: 6px; padding: 22px; color: var(--muted); max-width: 44em; }
.todo a { color: var(--blue); }

/* sandbox */
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tool { border: 1px solid var(--rule); background: var(--plate); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.side h3 { font-size: 15px; margin: 0 0 6px; }
.side p, .side li { font-size: 14px; color: var(--muted); }
.side ul { padding-inline-start: 18px; margin: 0; }
.side a { color: var(--blue); }

/* Latin-script locales use EB Garamond, which sets smaller than CJK at the same size */
:root.latin body { font-size: 17px; }
:root.latin .stmt { font-size: 23px; }
:root.latin var { font-size: 1.04em; }
/* Arabic letters join, so no tracking; Devanagari and Arabic need taller lines */
:root[lang="ar"] *, :root[lang="hi"] .eyebrow, :root[lang="hi"] nav h2 { letter-spacing: 0 !important; }
:root[lang="ar"] body, :root[lang="hi"] body { line-height: 1.95; }
:root[lang="ar"] body { font-size: 16px; }

@media (max-width: 900px) {
  .prop { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav { display: none; }
  .navsel { display: block; width: 100%; margin: 14px 0 12px; padding: 8px; font: inherit; border: 1px solid var(--rule); border-radius: 4px; background: var(--plate); color: var(--ink); }
  .stmt { font-size: 18px; }
}
</style>
</head>
<body>
<header class="top">
  <h1><span id="h1a">几何原本</span> <span id="h1b" class="accent">卷一</span></h1>
  <p id="tagline"></p>
  <select id="lang" class="langsel"></select>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <select class="navsel" id="navsel"></select>
    <div id="view"></div>
  </main>
</div>

<script>
// ---------------------------------------------------------------- text
// All visible text lives in i18n/<code>.js, which sets I18N[code]; T is the active locale.
const LANGS = { zh: "中文", en: "English", es: "Español", fr: "Français", de: "Deutsch", ru: "Русский", ar: "العربية", hi: "हिन्दी", ja: "日本語" };
const FONTS = {
  zh: ["\"Noto Serif SC\", \"Songti SC\", serif", "Noto+Serif+SC:wght@400;600;900"],
  ja: ["\"Noto Serif JP\", \"Hiragino Mincho ProN\", serif", "Noto+Serif+JP:wght@400;600;900"],
  hi: ["\"Noto Serif Devanagari\", \"Kohinoor Devanagari\", serif", "Noto+Serif+Devanagari:wght@400;600;800"],
  ar: ["\"Noto Naskh Arabic\", \"Geeza Pro\", serif", "Noto+Naskh+Arabic:wght@400;600;700"]
};
const LATIN_FONT = "\"EB Garamond\", Georgia, \"Times New Roman\", serif";
// 作 = problem (ends Q.E.F.), 证 = theorem (ends Q.E.D.), for I.1 … I.48
const KINDS = "作作作证证证证证作作作作证证证证证证证证证作作证证证证证证证作证证证证证证证证证证作证作作作证证";
window.I18N = window.I18N || {};
let T = null, LANG = "zh";

function tr(s, vars) { return s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)); }
function refText(r) {
  const m = r.match(/^([DPA])(\d+)$/);
  if (m) {
    const n = +m[2];
    const [lab, arr] = m[1] === "D" ? [T.ui.def, T.defs] : m[1] === "P" ? [T.ui.post, T.posts] : [T.ui.ax, T.axioms];
    return [lab + " " + n, arr[n - 1]];
  }
  const n = +r.slice(2);
  return [T.ui.prop + " I." + n, T.props[n - 1][0]];
}
// Figure letters: runs of 1–5 capitals not touching other Latin letters (so "Tómese" or "Über" stay plain).
const fmt = s => s.replace(/(?<![\p{Script=Latin}\d])([A-Z]{1,5})(?![\p{Script=Latin}\d'’])/gu, "<var>$1</var>");

// ---------------------------------------------------------------- geometry
const V = {
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }),
  dot: (a, b) => a.x * b.x + a.y * b.y,
  len: a => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  unit: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  perp: a => ({ x: a.y, y: -a.x }),
  mid: (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }),
  lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
  proj: (p, a, b) => { const d = V.sub(b, a); return V.add(a, V.mul(d, V.dot(V.sub(p, a), d) / V.dot(d, d))); }
};
// Equilateral apex on segment ab, on the side away from point `away`.
function apex(a, b, away) {
  const m = V.mid(a, b), n = V.unit(V.perp(V.sub(b, a)));
  const s = V.dot(n, V.sub(m, away)) >= 0 ? 1 : -1;
  return V.add(m, V.mul(n, s * V.dist(a, b) * Math.sqrt(3) / 2));
}
// Outward square on pq, away from point `away`: returns [p', q'].
function square(p, q, away) {
  let n = V.perp(V.sub(q, p));
  if (V.dot(n, V.sub(away, p)) > 0) n = V.mul(n, -1);
  return [V.add(p, n), V.add(q, n)];
}
// Curve descriptor: {k:'L', a, b, seg} or {k:'C', c, r}
function curveOf(o) {
  if (!o.val) return null;
  if (o.type === "seg" || o.type === "line") return { k: "L", a: o.val.a, b: o.val.b, seg: o.type === "seg" };
  if (o.type === "circ") return { k: "C", c: o.val.c, r: o.val.r };
  return null;
}
function intersect(c1, c2) {
  const E = 1e-9, T = 1e-6;
  if (!c1 || !c2) return [];
  if (c1.k === "C" && c2.k === "L") return intersect(c2, c1);
  if (c1.k === "L" && c2.k === "L") {
    const d1 = V.sub(c1.b, c1.a), d2 = V.sub(c2.b, c2.a);
    const den = d1.x * d2.y - d1.y * d2.x;
    if (Math.abs(den) < E) return [null];
    const w = V.sub(c2.a, c1.a);
    const t = (w.x * d2.y - w.y * d2.x) / den, u = (w.x * d1.y - w.y * d1.x) / den;
    if ((c1.seg && (t < -T || t > 1 + T)) || (c2.seg && (u < -T || u > 1 + T))) return [null];
    return [V.add(c1.a, V.mul(d1, t))];
  }
  if (c1.k === "L" && c2.k === "C") {
    const d = V.sub(c1.b, c1.a), f = V.sub(c1.a, c2.c);
    const A = V.dot(d, d), B = 2 * V.dot(f, d), C = V.dot(f, f) - c2.r * c2.r;
    const disc = B * B - 4 * A * C;
    if (disc < 0) return [null, null];
    const s = Math.sqrt(disc);
    return [(-B - s) / (2 * A), (-B + s) / (2 * A)].map(t =>
      c1.seg && (t < -T || t > 1 + T) ? null : V.add(c1.a, V.mul(d, t)));
  }
  const d = V.dist(c1.c, c2.c);
  if (d < E || d > c1.r + c2.r || d < Math.abs(c1.r - c2.r)) return [null, null];
  const a = (c1.r * c1.r - c2.r * c2.r + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, c1.r * c1.r - a * a));
  const u = V.unit(V.sub(c2.c, c1.c)), n = V.perp(u);
  const base = V.add(c1.c, V.mul(u, a));
  return [V.add(base, V.mul(n, h)), V.sub(base, V.mul(n, h))];
}

// ---------------------------------------------------------------- scene
class Scene {
  constructor() { this.list = []; this.by = {}; }
  add(o) { o.st = o.st || "ink"; this.list.push(o); this.by[o.id] = o; return o; }
  free(id, x, y, o = {}) { return this.add({ id, type: "pt", kind: "free", x, y, ...o }); }
  pt(id, f, o = {}) { return this.add({ id, type: "pt", kind: "fn", f, ...o }); }
  glide(id, param, f, proj, o = {}) { return this.add({ id, type: "pt", kind: "glide", param, f, proj, ...o }); }
  ix(id, a, b, i, o = {}) { return this.add({ id, type: "pt", kind: "ix", a, b, i, ...o }); }
  seg(id, a, b, o = {}) { return this.add({ id, type: "seg", a, b, ...o }); }
  line(id, a, b, o = {}) { return this.add({ id, type: "line", a, b, ...o }); }
  circ(id, c, p, o = {}) { return this.add({ id, type: "circ", c, p, ...o }); }
  poly(id, pts, o = {}) { return this.add({ id, type: "poly", pts, ...o }); }
  ang(id, a, v, b, o = {}) { return this.add({ id, type: "ang", a, v, b, ...o }); }
  rang(id, a, v, b, o = {}) { return this.add({ id, type: "rang", a, v, b, ...o }); }
  remove(ids) { const s = new Set(ids); this.list = this.list.filter(o => !s.has(o.id)); ids.forEach(i => delete this.by[i]); }
  eval() {
    const g = id => (this.by[id] && this.by[id].val) || null;
    const all = (...ids) => ids.every(i => g(i));
    for (const o of this.list) {
      let v = null;
      switch (o.type) {
        case "pt":
          if (o.kind === "free") v = { x: o.x, y: o.y };
          else if (o.kind === "fn") { try { v = o.f(g); } catch (e) { v = null; } }
          else if (o.kind === "glide") { try { v = o.f(g, o.param); } catch (e) { v = null; } }
          else v = intersect(curveOf(this.by[o.a] || {}), curveOf(this.by[o.b] || {}))[o.i] || null;
          break;
        case "seg": case "line":
          if (all(o.a, o.b) && V.dist(g(o.a), g(o.b)) > 1e-6) v = { a: g(o.a), b: g(o.b) };
          break;
        case "circ":
          if (all(o.c, o.p)) v = { c: g(o.c), r: V.dist(g(o.c), g(o.p)), p: g(o.p) };
          break;
        case "poly":
          if (all(...o.pts)) v = o.pts.map(g);
          break;
        default:
          if (all(o.a, o.v, o.b)) v = { a: g(o.a), v: g(o.v), b: g(o.b) };
      }
      o.val = v;
    }
  }
}

// ---------------------------------------------------------------- renderer
const NS = "http://www.w3.org/2000/svg";
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function restart(el, cls) {
  if (reduced) return;
  // only one animation class at a time: a pulse replacing an unfinished draw would leave the stroke hidden
  el.classList.remove("draw", "fade", "pulse"); void el.getBoundingClientRect(); el.classList.add(cls);
}

class Renderer {
  constructor(svg, scene, vb) {
    this.svg = svg; this.S = scene; this.vb = vb; this.el = {};
    svg.setAttribute("viewBox", vb.join(" "));
    this.gFill = mk("g", {}, svg); this.gLine = mk("g", {}, svg);
    this.gOver = mk("g", {}, svg); this.gPt = mk("g", {}, svg); this.gLab = mk("g", {}, svg);
    this.vis = null; this.hl = new Set();
    this.canDrag = () => true;
    svg.addEventListener("pointerdown", e => this.down(e));
    svg.addEventListener("pointermove", e => this.move(e));
    svg.addEventListener("pointerup", e => this.up(e));
    svg.addEventListener("pointercancel", e => this.up(e));
    svg.addEventListener("animationend", e => e.target.classList.remove("draw", "fade", "pulse"));
  }
  toSvg(e) {
    const p = this.svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(this.svg.getScreenCTM().inverse());
    return { x: q.x, y: q.y };
  }
  clamp(p) {
    const [x0, y0, w, h] = this.vb;
    return { x: Math.min(x0 + w - 10, Math.max(x0 + 10, p.x)), y: Math.min(y0 + h - 10, Math.max(y0 + 10, p.y)) };
  }
  shown(o) { return (!this.vis || this.vis.has(o.id)) && o.val; }
  down(e) {
    const id = e.target.dataset && e.target.dataset.id;
    const o = id && this.S.by[id];
    if (o && (o.kind === "free" || o.kind === "glide") && this.canDrag(o)) {
      this.drag = o; this.svg.setPointerCapture(e.pointerId); e.preventDefault();
      return;
    }
    this.onDown && this.onDown(e, this.toSvg(e));
  }
  move(e) {
    const m = this.toSvg(e);
    if (this.drag) {
      const o = this.drag, c = this.clamp(m);
      if (o.kind === "free") { o.x = c.x; o.y = c.y; } else o.param = o.proj(id => this.S.by[id].val, c);
      this.render();
      this.onDrag && this.onDrag();
      return;
    }
    this.onMove && this.onMove(e, m);
  }
  up(e) { if (this.drag) { this.drag = null; } }

  render(anim = new Set(), pulse = false) {
    this.S.eval();
    const pts = this.S.list.filter(o => o.type === "pt" && this.shown(o) && o.lab !== false);
    const cx = pts.reduce((s, o) => s + o.val.x, 0) / (pts.length || 1);
    const cy = pts.reduce((s, o) => s + o.val.y, 0) / (pts.length || 1);
    const live = new Set();
    for (const o of this.S.list) {
      live.add(o.id);
      let el = this.el[o.id];
      if (!el) el = this.el[o.id] = this.create(o);
      const on = this.shown(o);
      for (const n of el.nodes) n.style.display = on ? "" : "none";
      if (!on) continue;
      const hl = this.hl.has(o.id);
      this.update(o, el, hl, cx, cy);
      if (anim.has(o.id)) {
        if (el.path) restart(el.path, el.anim);
        if (el.dot) restart(el.dot, "fade"), el.lab && restart(el.lab, "fade");
      } else if (hl && pulse && el.path && o.type !== "poly") restart(el.path, "pulse");

    for (const id in this.el) if (!live.has(id)) { this.el[id].nodes.forEach(n => n.remove()); delete this.el[id]; }
  }
  create(o) {
    if (o.type === "pt") {
      const g = mk("g", {}, this.gPt);
      const drag = o.kind === "free" || o.kind === "glide";
      const dot = mk("circle", { class: "pt" + (drag ? " drag" : ""), r: drag ? 6.5 : 4.2 }, g);
      const hit = mk("circle", { class: "hit", r: 20, "data-id": o.id }, g);
      if (!drag) hit.style.pointerEvents = "none";
      const nodes = [g];
      let lab = null;
      if (o.lab !== false) { lab = mk("text", { class: "lab" }, this.gLab); lab.textContent = o.name || o.id; nodes.push(lab); }
      return { nodes, dot, hit, lab };
    }
    const layer = o.type === "poly" ? this.gFill : (o.type === "ang" || o.type === "rang") ? this.gOver : this.gLine;
    const path = mk("path", { pathLength: 1 }, layer);
    return { nodes: [path], path, anim: o.type === "poly" ? "fade" : "draw" };
  }
  update(o, el, hl, cx, cy) {
    const f = n => n.toFixed(2);
    if (o.type === "pt") {
      const p = o.val;
      el.dot.setAttribute("cx", f(p.x)); el.dot.setAttribute("cy", f(p.y));
      el.hit.setAttribute("cx", f(p.x)); el.hit.setAttribute("cy", f(p.y));
      el.dot.classList.toggle("hl", hl);
      if (el.lab) {
        let d = o.ld ? V.unit(o.ld) : V.unit({ x: p.x - cx, y: p.y - cy });
        if (!o.ld && Math.hypot(p.x - cx, p.y - cy) < 1) d = { x: -0.7, y: -0.7 };
        el.lab.setAttribute("x", f(p.x + d.x * 19)); el.lab.setAttribute("y", f(p.y + d.y * 19));
      }
      return;
    }
    const P = el.path;
    let d = "";
    const v = o.val;
    if (o.type === "seg") d = `M${f(v.a.x)} ${f(v.a.y)}L${f(v.b.x)} ${f(v.b.y)}`;
    else if (o.type === "line") {
      const u = V.unit(V.sub(v.b, v.a)), a = V.sub(v.a, V.mul(u, 3000)), b = V.add(v.a, V.mul(u, 3000));
      d = `M${f(a.x)} ${f(a.y)}L${f(b.x)} ${f(b.y)}`;
    } else if (o.type === "circ") {
      const p = v.p, q = V.sub(V.mul(v.c, 2), p), r = f(v.r);
      d = `M${f(p.x)} ${f(p.y)}A${r} ${r} 0 1 1 ${f(q.x)} ${f(q.y)}A${r} ${r} 0 1 1 ${f(p.x)} ${f(p.y)}`;
    } else if (o.type === "poly") {
      d = "M" + v.map(p => f(p.x) + " " + f(p.y)).join("L") + "Z";
    } else if (o.type === "ang") {
      const r = o.r || 24;
      const a1 = Math.atan2(v.a.y - v.v.y, v.a.x - v.v.x), a2 = Math.atan2(v.b.y - v.v.y, v.b.x - v.v.x);
      let dd = a2 - a1; while (dd > Math.PI) dd -= 2 * Math.PI; while (dd <= -Math.PI) dd += 2 * Math.PI;
      const s = { x: v.v.x + r * Math.cos(a1), y: v.v.y + r * Math.sin(a1) };
      const e = { x: v.v.x + r * Math.cos(a1 + dd), y: v.v.y + r * Math.sin(a1 + dd) };
      d = `M${f(v.v.x)} ${f(v.v.y)}L${f(s.x)} ${f(s.y)}A${r} ${r} 0 0 ${dd > 0 ? 1 : 0} ${f(e.x)} ${f(e.y)}Z`;
    } else if (o.type === "rang") {
      const k = 13, ua = V.mul(V.unit(V.sub(v.a, v.v)), k), ub = V.mul(V.unit(V.sub(v.b, v.v)), k);
      const p1 = V.add(v.v, ua), p2 = V.add(p1, ub), p3 = V.add(v.v, ub);
      d = `M${f(p1.x)} ${f(p1.y)}L${f(p2.x)} ${f(p2.y)}L${f(p3.x)} ${f(p3.y)}`;
    }
    P.setAttribute("d", d);
    let cls;
    if (o.type === "poly") cls = "f-" + o.st;
    else if (o.type === "ang") cls = `s ang s-${o.st} f-${o.st}`;
    else cls = `s s-${o.st}` + (o.type === "rang" ? " ang" : "") + (hl ? " hl" : "");
    // keep animation classes that are currently running
    for (const k of ["draw", "fade", "pulse"]) if (P.classList.contains(k)) cls += " " + k;
    P.setAttribute("class", cls);
  }
}

    return `<li data-i="${i}"><div>${fmt(texts[i])}${why.length ? `<div class="why">${why.map(w => `<span class="chip">${w[0]}</span>`).join("")}</div>` + why.map(w => `<div class="quote">${w[0]}${T.ui.colon}${w[1]}</div>`).join("") : ""}</div></li>`;
  }).join("");
  const visAt = k => { const v = new Set(); for (let i = 0; i <= k; i++) { (steps[i].show || []).forEach(x => v.add(x)); (steps[i].hide || []).forEach(x => v.delete(x)); } return v; };
  let cur = -1, timer = null;
  function go(k) {
    k = Math.max(0, Math.min(steps.length - 1, k));
    const before = cur >= 0 ? visAt(cur) : new Set();
    const now = visAt(k);
    const anim = new Set([...now].filter(x => !before.has(x)));
    cur = k;
    R.vis = now; R.hl = new Set(steps[k].hl || []);
    R.render(anim, true);
    ol.querySelectorAll("li").forEach((li, i) => { li.classList.toggle("cur", i === k); li.classList.toggle("done", i < k); });
    view.querySelector("#count").textContent = `${k + 1} / ${steps.length}`;
    view.querySelector("#prev").disabled = k === 0;
    view.querySelector("#next").disabled = k === steps.length - 1;
    view.querySelector("#qed").hidden = k !== steps.length - 1;
  }
  function stop() { clearInterval(timer); timer = null; view.querySelector("#play").textContent = T.ui.play; }
  view.querySelector("#prev").onclick = () => { stop(); go(cur - 1); };
  view.querySelector("#next").onclick = () => { stop(); go(cur + 1); };
  view.querySelector("#play").onclick = () => {
    if (timer) return stop();
    if (cur === steps.length - 1) go(0);
    view.querySelector("#play").textContent = T.ui.pause;
    timer = setInterval(() => { if (cur >= steps.length - 1) return stop(); go(cur + 1); }, 3200);
  };
  ol.onclick = e => { const li = e.target.closest("li"); if (li) { stop(); go(+li.dataset.i); } };
  R.onDrag = () => {};
  go(0);
  teardown = stop;
}

function mountIntro() {
  const list = arr => `<ol class="deflist">${arr.map((t, i) => `<li><span class="n">${i + 1}</span><span>${t}</span></li>`).join("")}</ol>`;
  view.innerHTML = `<div class="prose">
    <p class="eyebrow">${T.ui.introEyebrow}</p>
    <h2>${T.ui.defsTitle}</h2><p class="sub"><span lang="grc">ὅροι</span> · ${T.ui.defsSub}</p>${list(T.defs)}
    <h2>${T.ui.postsTitle}</h2><p class="sub"><span lang="grc">αἰτήματα</span> · ${T.ui.postsSub}</p>${list(T.posts)}
    <h2>${T.ui.axiomsTitle}</h2><p class="sub"><span lang="grc">κοιναὶ ἔννοιαι</span> · ${T.ui.axiomsSub}</p>${list(T.axioms)}
  </div>`;
}

function mountSandbox() {
  const U = T.ui;
  view.innerHTML = `
    <p class="eyebrow">${U.sbEyebrow}</p>
    <h2 class="stmt">${U.sbTitle}</h2>
    <div class="prop">
      <div>
        <div class="tools" role="toolbar" aria-label="${U.toolbar}">
          ${["move", "point", "seg", "line", "circ"].map(t => `<button class="tool" data-t="${t}">${U.tools[t]}</button>`).join("")}
          <button class="btn" id="undo">${U.undo}</button>
          <button class="btn" id="clear">${U.clear}</button>
        </div>
        <div class="plate" dir="ltr"><svg class="fig" role="img" aria-label="${U.board}"></svg></div>
        <div class="hint" id="shint"></div>
      </div>
      <div class="side">
        <h3>${U.howTo}</h3>
        <ul>${U.howItems.map(x => `<li>${x}</li>`).join("")}</ul>
        <h3 style="margin-top:18px">${U.tryIt}</h3>
        <ul>${U.tryItems.map(x => `<li>${fmt(x)}</li>`).join("")}</ul>
      </div>
    </div>`;
  const svg = view.querySelector("svg");
  const S = new Scene();
  const R = new Renderer(svg, S, [0, 0, 720, 560]);
  const hintEl = view.querySelector("#shint");
  const HINTS = U.hints;
  let tool = "circ", first = null, hist = [], nextName = 0;
  const preview = mk("path", { class: "preview" }, R.gOver);
  const snap = mk("circle", { class: "snap", r: 10 }, R.gOver);
  const label = () => {
    const used = new Set(S.list.map(o => o.id));
    for (;;) {
      const i = nextName++, ch = String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : "");
      if (!used.has(ch)) return ch;
    }
  };
  let uid = 0;
  const pts = () => S.list.filter(o => o.type === "pt" && o.val);
  function candidates() {
    const curves = S.list.filter(o => curveOf(o));
    const out = [], P = pts();
    for (let i = 0; i < curves.length; i++) for (let j = i + 1; j < curves.length; j++) {
      intersect(curveOf(curves[i]), curveOf(curves[j])).forEach((p, k) => {
        if (p && !P.some(q => V.dist(q.val, p) < 3)) out.push({ a: curves[i].id, b: curves[j].id, k, p });
      });
    }
    return out;
  }
  function find(m) {
    let best = null, bd = 16;
    for (const o of pts()) { const d = V.dist(o.val, m); if (d < bd) { bd = d; best = { id: o.id, p: o.val }; } }
    if (best) return best;
    for (const c of candidates()) { const d = V.dist(c.p, m); if (d < bd) { bd = d; best = { ix: c, p: c.p }; } }
    return best;
  }
  function resolve(m, added) {
    const f = find(m);
    if (f && f.id) return f.id;
    const id = label();
    if (f && f.ix) S.ix(id, f.ix.a, f.ix.b, f.ix.k);
    else S.free(id, m.x, m.y);
    added.push(id);
    return id;
  }
  function setTool(t) {
    tool = t; first = null; preview.setAttribute("d", "");
    view.querySelectorAll(".tool").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
    hintEl.textContent = HINTS[t];
  }
  R.canDrag = () => tool === "move";
  R.onDown = (e, m) => {
    if (tool === "move") return;
    m = R.clamp(m);
    const added = [];
    const id = resolve(m, added);
    if (tool === "point") { if (added.length) hist.push(added); R.render(new Set(added)); return; }
    if (!first) { first = { id, added }; R.render(new Set(added)); return; }
    if (id === first.id) return;
    const all = first.added.concat(added), k = "o" + uid++;
    if (tool === "seg") S.seg(k, first.id, id);
    else if (tool === "line") S.line(k, first.id, id);
    else S.circ(k, first.id, id, { st: "blue" });
    all.push(k); hist.push(all); first = null; preview.setAttribute("d", "");
    R.render(new Set(all));
  };
  R.onMove = (e, m) => {
    const f = tool !== "move" && find(m);
    snap.style.display = f ? "" : "none";
    if (f) { snap.setAttribute("cx", f.p.x); snap.setAttribute("cy", f.p.y); }
    if (first && S.by[first.id] && S.by[first.id].val) {
      const a = S.by[first.id].val, b = f ? f.p : m;
      if (tool === "circ") { const r = V.dist(a, b); preview.setAttribute("d", `M${a.x - r} ${a.y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`); }
      else preview.setAttribute("d", `M${a.x} ${a.y}L${b.x} ${b.y}`);
    }
  };
  svg.addEventListener("pointerleave", () => { snap.style.display = "none"; });
  view.querySelectorAll(".tool").forEach(b => b.onclick = () => setTool(b.dataset.t));
  view.querySelector("#undo").onclick = () => {
    if (first) { S.remove(first.added); first = null; preview.setAttribute("d", ""); }
    else if (hist.length) S.remove(hist.pop());
    R.render();
  };
  view.querySelector("#clear").onclick = () => { S.remove(S.list.map(o => o.id)); hist = []; first = null; nextName = 0; seed(); };
  function seed() {
    S.free(label(), 270, 330); S.free(label(), 450, 330); S.seg("o" + uid++, "A", "B");
    R.render();
  }
  seed();
  setTool("circ");
}

// ---------------------------------------------------------------- routing
const nav = document.getElementById("nav"), sel = document.getElementById("navsel"), langSel = document.getElementById("lang");

function buildChrome() {
  const U = T.ui, root = document.documentElement;
  root.lang = T.htmlLang; root.dir = T.dir || "ltr";
  root.style.setProperty("--serif", (FONTS[LANG] || [LATIN_FONT])[0]);
  root.classList.toggle("latin", !FONTS[LANG]);
  if (FONTS[LANG] && !document.getElementById("font-" + LANG)) {
    const l = document.createElement("link");
    l.id = "font-" + LANG; l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${FONTS[LANG][1]}&display=swap`;
    document.head.appendChild(l);
  }
  document.title = U.title;
  document.querySelector('meta[name="description"]').content = U.metaDesc;
  document.getElementById("h1a").textContent = U.h1;
  document.getElementById("h1b").textContent = U.h1b;
  document.getElementById("tagline").textContent = U.tagline;
  langSel.setAttribute("aria-label", U.language);
  nav.setAttribute("aria-label", U.contents); sel.setAttribute("aria-label", U.contents);
  nav.innerHTML =
    `<h2>${U.navOpen}</h2><a href="#intro" data-r="intro"><span class="n">·</span><span class="t">${U.navIntro}</span></a>` +
    `<h2>${U.navHands}</h2><a href="#sandbox" data-r="sandbox"><span class="n">·</span><span class="t">${U.navSandbox}</span></a>` +
    `<h2>${U.navProps}</h2>` + T.props.map((p, i) => `<a href="#p${i + 1}" data-r="p${i + 1}" class="${LIVE[i + 1] ? "live" : ""}" title="${p[0]}"><span class="n">${i + 1}</span><span class="t">${p[1]}</span></a>`).join("");
  sel.innerHTML = `<option value="intro">${U.navOpen}${U.colon}${U.navIntro}</option><option value="sandbox">${U.navSandbox}</option>` +
    T.props.map((p, i) => `<option value="p${i + 1}">${U.prop} I.${i + 1} · ${p[1]}${LIVE[i + 1] ? " ●" : ""}</option>`).join("");
}

function route() {
  if (teardown) { teardown(); teardown = null; }
  let r = location.hash.slice(1) || "p1";
  const m = r.match(/^p(\d+)$/);
  if (m && (+m[1] < 1 || +m[1] > 48)) r = "p1";
  if (r === "intro") mountIntro();
  else if (r === "sandbox") mountSandbox();
  else if (m) mountProp(+m[1]);
  else { r = "p1"; mountProp(1); }
  nav.querySelectorAll("a").forEach(a => { if (a.dataset.r === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  sel.value = r;
}

function loadLang(code) {
  if (I18N[code]) return Promise.resolve(I18N[code]);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = `i18n/${code}.js`;
    s.onload = () => (I18N[code] ? res(I18N[code]) : rej(new Error(code)));
    s.onerror = () => rej(new Error(code));
    document.head.appendChild(s);
  });
}
// ?lang= first (shareable links), then the viewer's last choice, then the browser's languages.
function pickLang() {
  let q = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  if (q && LANGS[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && LANGS[s]) return s; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || ""]) { const c = l.slice(0, 2).toLowerCase(); if (LANGS[c]) return c; }
  return "en";
}
async function setLang(code, remember) {
  try { T = await loadLang(code); LANG = code; }
  catch (e) { if (code !== "zh") return setLang("zh", false); throw e; }
  langSel.value = LANG;
  if (remember) {
    try { localStorage.setItem("lang", LANG); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u); } catch (e) {}
  }
  buildChrome();
  route();
}

langSel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}" lang="${k}">${v}</option>`).join("");
langSel.onchange = () => setLang(langSel.value, true);
sel.onchange = () => { location.hash = sel.value; };
addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
setLang(pickLang(), false);
</script>
