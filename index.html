  :root.swap body { visibility: hidden; }

<script>
// Pick the language before first paint: ?lang= first (shareable links), then the viewer's last choice, then the browser's languages.
// Each page is pre-rendered in one language (data-baked); when another is picked, the page stays hidden until it is redrawn.
(function () {
  const codes = ["zh", "en", "es", "fr", "de", "ru", "ar", "hi", "ja"], root = document.documentElement;
  let q = null, l = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  if (codes.includes(q)) l = q;
  if (!l) try { const s = localStorage.getItem("lang"); if (codes.includes(s)) l = s; } catch (e) {}
  if (!l) for (const x of navigator.languages || [navigator.language || ""]) { const c = x.slice(0, 2).toLowerCase(); if (codes.includes(c)) { l = c; break; } }
  window.FIRST_LANG = l || "en";
  if (root.dataset.baked && root.dataset.baked !== window.FIRST_LANG) {
    root.classList.add("swap");
    setTimeout(() => root.classList.remove("swap"), 3000);
  }
})();
</script>

<style>
/* Layout: book index on the left, a figure "plate" beside its proof, colored after Byrne's 1847 Euclid (red, yellow, blue on paper). */
:root {
  --paper: #f7f7f3;
  --plate: #ffffff;
  --ink: #1d2027;
  --muted: #6b6f78;
  --rule: #dcddd6;
  --soft: #eeefe9;
  --red: #c4262e;
  --blue: #1f5aa6;
  --yellow: #d9a514;
  --aux: #a9adb4;
  --f-red: rgba(196, 38, 46, .22);
  --f-blue: rgba(31, 90, 166, .22);
  --f-yel: rgba(217, 165, 20, .30);
  --green: #2f8a4e;
  --teal: #1b8a8f;
  --card: 0 1px 2px rgba(29, 32, 39, .05), 0 4px 14px rgba(29, 32, 39, .05);
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans", "Noto Sans", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --latin: "EB Garamond", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171b; --plate: #1c1f25; --ink: #e8e6df; --muted: #9a9ea6; --rule: #30343c; --soft: #252930;
    --red: #ec5a5f; --blue: #6b9be0; --yellow: #f0c040; --aux: #5d626b; --green: #5cbf7c; --teal: #4fc0c4; --card: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); --green: #5cbf7c; --teal: #4fc0c4; --card: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    --f-red: rgba(236, 90, 95, .25); --f-blue: rgba(107, 155, 224, .25); --f-yel: rgba(240, 192, 64, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15171b; --plate: #1c1f25; --ink: #e8e6df; --muted: #9a9ea6; --rule: #30343c; --soft: #252930;
  --red: #ec5a5f; --blue: #6b9be0; --yellow: #f0c040; --aux: #5d626b;
  --f-red: rgba(236, 90, 95, .25); --f-blue: rgba(107, 155, 224, .25); --f-yel: rgba(240, 192, 64, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 15px; line-height: 1.75; }
var, .lt { font-family: var(--latin); font-style: italic; font-size: 1.12em; }
/* each figure name is its own bidi run, so "CA، CB" reads in order inside Arabic text */
var { unicode-bidi: isolate; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Site header: brand, subject links, visits and language. Sans-serif chrome around serif reading text. */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; font-family: var(--sans); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand .logo { width: 30px; height: 30px; flex: none; }
.brand .bname { font-family: var(--serif); font-size: 21px; font-weight: 900; letter-spacing: .06em; line-height: 1.1; }
.brand .bsub { font-size: 12px; color: var(--muted); border-inline-start: 1px solid var(--rule); padding-inline-start: 10px; line-height: 1.3; }
.subjects { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { --c: var(--ink); display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink); text-decoration: none; border: 1px solid transparent; line-height: 1.6; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pill:hover { background: var(--soft); }
.pill[aria-current="true"] { border-color: var(--rule); background: var(--plate); }
[data-s="math"] { --c: var(--red); } [data-s="phys"] { --c: var(--blue); } [data-s="chem"] { --c: var(--yellow); } [data-s="bio"] { --c: var(--green); } [data-s="geo"] { --c: var(--teal); }
.htools { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }
.visits { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.langsel { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--plate); color: var(--ink); }

/* Book heading above the Euclid pages */
.book { padding-block: 22px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
.book .crumb { margin: 0; width: 100%; font: 12.5px var(--sans); }
.book .crumb a { color: var(--muted); text-decoration: none; }
.book .crumb a:hover { color: var(--ink); }
.book h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .08em; }
.book h1 .accent { color: var(--red); }
.book p { margin: 0; color: var(--muted); font-size: 13px; }

/* Home page: hero, then one section of cards per subject */
:root:is([data-view="home"], [data-view="lab"]) :is(.book, nav#nav, .navsel) { display: none !important; }
:root:is([data-view="home"], [data-view="lab"]) .app { grid-template-columns: minmax(0, 1fr); }
.hub { max-width: 1120px; margin-inline: auto; }
.hero { padding-block: 28px 8px; }
.hero-t { font-size: clamp(28px, 4.4vw, 42px); font-weight: 900; line-height: 1.25; margin: 0 0 10px; letter-spacing: .02em; text-wrap: balance; }
.hero-p { color: var(--muted); font-size: 16px; max-width: 38em; margin: 0; }
.subject { padding-top: 34px; scroll-margin-top: 70px; }
.shead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--c); }
.shead h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .04em; }
.shead .count { font: 13px var(--sans); color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: var(--plate); border: 1px solid var(--rule); border-radius: 10px; color: var(--ink); text-decoration: none; box-shadow: var(--card); border-top: 3px solid var(--c); transition: transform .15s, border-color .15s; }
.card:hover { transform: translateY(-2px); border-color: var(--c); }
.card .ct { font-weight: 600; line-height: 1.45; }
.card .cd { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.card .cm { margin-top: auto; font: 12.5px var(--sans); color: var(--c); font-weight: 600; }
.card.feature { grid-row: span 2; }
.card.lesson { padding-top: 0; overflow: hidden; }
.card .cover { display: block; width: calc(100% + 32px); max-width: none; margin: 0 -16px 4px; aspect-ratio: 16 / 9; height: auto; object-fit: cover; background: var(--soft); border-bottom: 1px solid var(--rule); }
:root[dir="rtl"] .card .arr { display: inline-block; transform: scaleX(-1); }
.card.feature .ct { font-size: 20px; font-weight: 900; }
.emblem { width: 120px; height: 80px; margin-bottom: 4px; }
.emblem circle { fill: none; stroke-width: 2.5; }
.e-blue { stroke: var(--blue); } .e-red { stroke: var(--red); } .e-yel { fill: var(--f-yel); stroke: var(--yellow); stroke-width: 2.5; stroke-linejoin: round; }
/* Lesson page: the lab's lesson in a frame */
.lesson-page { max-width: 1280px; margin-inline: auto; }
.lesson-page .crumb { margin: 0 0 2px; font: 12.5px var(--sans); }
.lesson-page .crumb a { color: var(--c); text-decoration: none; font-weight: 600; }
.lhead { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
.lhead .stmt { margin: 0; }
.lmeta { font: 13px var(--sans); color: var(--muted); }
.lhead .btn { margin-inline-start: auto; align-self: center; }
.lframe { border: 1px solid var(--rule); border-top: 3px solid var(--c); border-radius: 10px; overflow: hidden; box-shadow: var(--card); background: #000; }
.lframe iframe { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 150px); min-height: 420px; border: 0; }
@media (max-width: 720px) { .lframe iframe { aspect-ratio: 3 / 4; min-height: 0; max-height: calc(100vh - 120px); } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 28px; }
#nav { border-inline-end: 1px solid var(--rule); padding-block: 18px 40px; padding-inline-end: 12px; max-height: calc(100vh - 60px); overflow-y: auto; position: sticky; top: 60px; }
#nav { font-family: var(--sans); }
#nav h2 { font-size: 12px; letter-spacing: .2em; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
#nav h2:first-child { margin-top: 0; }
#nav a { display: grid; grid-template-columns: 30px 1fr; gap: 4px; color: var(--ink); text-decoration: none; padding: 3px 8px; border-radius: 4px; font-size: 13.5px; line-height: 1.5; }
#nav a:hover { background: var(--soft); }
#nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
#nav a .n { font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--muted); }
#nav a[aria-current="page"] .n { color: var(--paper); opacity: .7; }
#nav a.live .t::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-inline-start: 6px; vertical-align: middle; }
#nav a .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navsel { display: none; }

main { padding-block: 22px 60px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--muted); margin: 0 0 4px; }
.eyebrow .kind { color: var(--red); }
.stmt { font-size: 21px; font-weight: 600; line-height: 1.6; margin: 0 0 18px; max-width: 40em; text-wrap: balance; }

.prop { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.plate { background: var(--plate); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; box-shadow: var(--card); }
.plate svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint { font-size: 12.5px; color: var(--muted); padding: 6px 4px 0; }
.controls { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--plate); padding: 5px 14px; border-radius: 6px; font-family: var(--sans); cursor: pointer; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.count { margin-inline-start: auto; font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--muted); }

ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 8px 10px; border-radius: 5px; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; }
ol.steps li::before { content: counter(s); font-family: var(--latin); color: var(--aux); font-size: 15px; }
ol.steps li.done { color: var(--ink); }
ol.steps li.cur { background: var(--soft); color: var(--ink); }
ol.steps li.cur::before { color: var(--red); font-weight: 500; }
ol.steps li:hover:not(.cur) { background: color-mix(in srgb, var(--soft) 55%, transparent); }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; color: var(--muted); background: var(--plate); }
.quote { display: none; font-size: 13px; color: var(--muted); border-inline-start: 2px solid var(--yellow); padding-inline-start: 10px; margin-top: 6px; }
li.cur .quote { display: block; }
.qed { margin-top: 14px; font-size: 13px; color: var(--muted); letter-spacing: .1em; }

/* figure styling */
.fig .s { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.2; }
.s-ink { stroke: var(--ink); } .s-red { stroke: var(--red); } .s-blue { stroke: var(--blue); } .s-yel { stroke: var(--yellow); }
.s-aux { stroke: var(--aux); stroke-width: 1.3 !important; }
.fig .s.hl { stroke-width: 4.4; }
.f-red { fill: var(--f-red); } .f-blue { fill: var(--f-blue); } .f-yel { fill: var(--f-yel); }
.fig .ang { stroke-width: 1.6; }
.fig .pt { fill: var(--ink); }
.fig .pt.drag { fill: var(--plate); stroke: var(--red); stroke-width: 2.5; cursor: grab; }
.fig .pt.hl { fill: var(--red); }
.fig .hit { fill: transparent; cursor: grab; }
.fig .lab { font-family: var(--latin); font-style: italic; font-size: 21px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke: var(--plate); stroke-width: 4px; }
.fig .preview { stroke: var(--red); stroke-dasharray: 5 5; stroke-width: 1.4; fill: none; pointer-events: none; }
.fig .snap { fill: none; stroke: var(--red); stroke-width: 1.6; pointer-events: none; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease forwards; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.pulse { animation: pulse 1.2s ease 1; }
@keyframes pulse { 0%, 100% { opacity: 1; } 40% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .draw, .fade, .pulse { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; } }

/* intro + placeholders */
.prose { max-width: 44em; }
.prose h2 { font-size: 19px; margin: 30px 0 4px; font-weight: 900; letter-spacing: .06em; }
.prose h2:first-of-type { margin-top: 6px; }

.side ul { padding-inline-start: 18px; margin: 0; }

// ---------------------------------------------------------------- geometry

// ---------------------------------------------------------------- scene
class Scene {

  seg(id, a, b, o = {}) { return this.add({ id, type: "seg", a, b, ...o }); }
  line(id, a, b, o = {}) { return this.add({ id, type: "line", a, b, ...o }); }
  circ(id, c, p, o = {}) { return this.add({ id, type: "circ", c, p, ...o }); }
  poly(id, pts, o = {}) { return this.add({ id, type: "poly", pts, ...o }); }
  ang(id, a, v, b, o = {}) { return this.add({ id, type: "ang", a, v, b, ...o }); }

    const g = id => (this.by[id] && this.by[id].val) || null;
    const all = (...ids) => ids.every(i => g(i));
    for (const o of this.list) {
      let v = null;
      switch (o.type) {
        case "pt":
          if (o.kind === "free") v = { x: o.x, y: o.y };

// ---------------------------------------------------------------- propositions
// Each ready proposition lives in props/pNN.js and calls PROP(n, {vb, build, steps, text}).
const LIVE = {};
function PROP(n, def) { LIVE[n] = def; }

// ---------------------------------------------------------------- views
const view = document.getElementById("view");

// keep: the page was pre-rendered for this proposition, so leave it in place while props/pNN.js loads
function mountProp(n, keep) {

    if (!keep) view.innerHTML = "";
    const want = location.pathname;
    loadScript(`/props/p${String(n).padStart(2, "0")}.js`).then(() => { if (location.pathname === want) route(); }, () => {});
    return;

    view.querySelector("#prev").disabled = k === 0;
    view.querySelector("#next").disabled = k === steps.length - 1;
    view.querySelector("#qed").hidden = k !== steps.length - 1;
    const tw = steps[k].tween;
    if (tw && fwd && !reduced) {
      const o = S.by[tw[0]], t0 = performance.now();
      const tick = now => {
        const u = Math.min(1, (now - t0) / 1600), e = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
        o.param = tw[1] + (tw[2] - tw[1]) * e;
        R.render();
        if (u < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
  }
  function stop() { clearInterval(timer); timer = null; cancelAnimationFrame(raf); view.querySelector("#play").textContent = T.ui.play; }
  view.querySelector("#prev").onclick = () => { stop(); go(cur - 1); };
  view.querySelector("#next").onclick = () => { stop(); go(cur + 1); };
  view.querySelector("#play").onclick = () => {
    if (timer) return stop();
    if (cur === steps.length - 1) go(0);
    view.querySelector("#play").textContent = T.ui.pause;
    timer = setInterval(() => { if (cur >= steps.length - 1) return stop(); go(cur + 1); }, 3200);
  };
  ol.onclick = e => { const li = e.target.closest("li"); if (li) { stop(); go(+li.dataset.i); } };
  R.onDrag = () => {};
  go(0);
  teardown = stop;
}

function mountIntro() {
  view.innerHTML = introHTML(T);
}

function mountSandbox() {
  const U = T.ui;
  view.innerHTML = sandboxHTML(T);
  const svg = view.querySelector("svg");
  const S = new Scene();
  const R = new Renderer(svg, S, [0, 0, 720, 560]);
  const hintEl = view.querySelector("#shint");
  const HINTS = U.hints;
  let tool = "circ", first = null, hist = [], nextName = 0;
  const preview = mk("path", { class: "preview" }, R.gOver);
  const snap = mk("circle", { class: "snap", r: 10 }, R.gOver);
  const label = () => {
    const used = new Set(S.list.map(o => o.id));
    for (;;) {
      const i = nextName++, ch = String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : "");
      if (!used.has(ch)) return ch;
    }
  };
  let uid = 0;
  const pts = () => S.list.filter(o => o.type === "pt" && o.val);
  function candidates() {
    const curves = S.list.filter(o => curveOf(o));
    const out = [], P = pts();
    for (let i = 0; i < curves.length; i++) for (let j = i + 1; j < curves.length; j++) {
      intersect(curveOf(curves[i]), curveOf(curves[j])).forEach((p, k) => {
        if (p && !P.some(q => V.dist(q.val, p) < 3)) out.push({ a: curves[i].id, b: curves[j].id, k, p });
      });
    }
    return out;
  }
  function find(m) {
    let best = null, bd = 16;
    for (const o of pts()) { const d = V.dist(o.val, m); if (d < bd) { bd = d; best = { id: o.id, p: o.val }; } }
    if (best) return best;
    for (const c of candidates()) { const d = V.dist(c.p, m); if (d < bd) { bd = d; best = { ix: c, p: c.p }; } }
    return best;
  }
  function resolve(m, added) {
    const f = find(m);
    if (f && f.id) return f.id;
    const id = label();
    if (f && f.ix) S.ix(id, f.ix.a, f.ix.b, f.ix.k);
    else S.free(id, m.x, m.y);
    added.push(id);
    return id;
  }
  function setTool(t) {
    tool = t; first = null; preview.setAttribute("d", "");
    view.querySelectorAll(".tool").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
    hintEl.textContent = HINTS[t];
  }
  R.canDrag = () => tool === "move";
  R.onDown = (e, m) => {
    if (tool === "move") return;
    m = R.clamp(m);
    const added = [];
    const id = resolve(m, added);
    if (tool === "point") { if (added.length) hist.push(added); R.render(new Set(added)); return; }
    if (!first) { first = { id, added }; R.render(new Set(added)); return; }
    if (id === first.id) return;
    const all = first.added.concat(added), k = "o" + uid++;
    if (tool === "seg") S.seg(k, first.id, id);
    else if (tool === "line") S.line(k, first.id, id);
    else S.circ(k, first.id, id, { st: "blue" });
    all.push(k); hist.push(all); first = null; preview.setAttribute("d", "");
    R.render(new Set(all));
  };
  R.onMove = (e, m) => {
    const f = tool !== "move" && find(m);
    snap.style.display = f ? "" : "none";
    if (f) { snap.setAttribute("cx", f.p.x); snap.setAttribute("cy", f.p.y); }
    if (first && S.by[first.id] && S.by[first.id].val) {
      const a = S.by[first.id].val, b = f ? f.p : m;
      if (tool === "circ") { const r = V.dist(a, b); preview.setAttribute("d", `M${a.x - r} ${a.y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`); }
      else preview.setAttribute("d", `M${a.x} ${a.y}L${b.x} ${b.y}`);
    }
  };
  svg.addEventListener("pointerleave", () => { snap.style.display = "none"; });
  view.querySelectorAll(".tool").forEach(b => b.onclick = () => setTool(b.dataset.t));
  view.querySelector("#undo").onclick = () => {
    if (first) { S.remove(first.added); first = null; preview.setAttribute("d", ""); }
    else if (hist.length) S.remove(hist.pop());
    R.render();
  };
  view.querySelector("#clear").onclick = () => { S.remove(S.list.map(o => o.id)); hist = []; first = null; nextName = 0; seed(); };
  function seed() {
    S.free(label(), 270, 330); S.free(label(), 450, 330); S.seg("o" + uid++, "A", "B");
    R.render();
  }
  seed();
  setTool("circ");
}

// ---------------------------------------------------------------- routing
// Each view has its own address (/, /p/12, /intro, /about …), served pre-rendered by build.mjs;
// links between them are followed here without reloading. Old #p12 links are moved to /p/12.
const nav = document.getElementById("nav"), sel = document.getElementById("navsel"), langSel = document.getElementById("lang");

function buildChrome() {
  const U = T.ui, root = document.documentElement;
  root.lang = T.htmlLang; root.dir = T.dir || "ltr";
  root.style.setProperty("--serif", (FONTS[LANG] || [LATIN_FONT])[0]);
  root.classList.toggle("latin", !FONTS[LANG]);
  if (FONTS[LANG] && !document.getElementById("font-" + LANG)) {
    const l = document.createElement("link");
    l.id = "font-" + LANG; l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${FONTS[LANG][1]}&display=swap`;
    document.head.appendChild(l);
  }
  document.getElementById("brand").textContent = T.hub.brand;
  document.getElementById("brandSub").textContent = T.hub.brandSub;
  document.getElementById("subjects").innerHTML = subjHTML(T);
  document.getElementById("subjects").setAttribute("aria-label", T.hub.home);
  document.getElementById("crumb").textContent = T.hub.subj.math;
  document.getElementById("h1a").textContent = U.h1;
  document.getElementById("h1b").textContent = U.h1b;
  document.getElementById("tagline").textContent = U.tagline;
  langSel.setAttribute("aria-label", U.language);
  showVisits();
  nav.setAttribute("aria-label", U.contents); sel.setAttribute("aria-label", U.contents);
  nav.innerHTML = navHTML(T);
  sel.innerHTML = selHTML(T);
  document.querySelectorAll(".ad .label").forEach(l => { l.textContent = U.ad; });
}

// Title, description, canonical and hreflang for the current view. The canonical keeps ?lang= only if the address has it.
function setHead(r) {
  const { title, desc } = headTexts(T, PAGES[LANG], r), path = pathFor(r);
  const url = SITE + path + (new URLSearchParams(location.search).has("lang") ? "?lang=" + LANG : "");
  document.title = title;
  document.querySelector('meta[name="description"]').content = desc;
  document.querySelector('meta[property="og:title"]').content = title;
  document.querySelector('meta[property="og:description"]').content = desc;
  document.querySelector('meta[property="og:url"]').content = url;
  document.querySelector('link[rel="canonical"]').href = url;
  document.querySelectorAll('link[rel="alternate"][data-l]').forEach(l => { l.href = SITE + path + (l.dataset.l ? "?lang=" + l.dataset.l : ""); });
}

// Visit counter (api/visits.js). A visit counts once per browser session; the label hides if the API is unreachable.
let VISITS = null;
function showVisits() {
  const el = document.getElementById("visits");
  if (VISITS == null || !T) { el.hidden = true; return; }
  el.textContent = tr(T.ui.visits, { n: new Intl.NumberFormat(T.htmlLang).format(VISITS) });
  el.hidden = false;
}
function loadVisits() {
  if (location.protocol === "file:") return;
  let hit = "1";
  try { if (sessionStorage.getItem("visited")) hit = "0"; sessionStorage.setItem("visited", "1"); } catch (e) {}
  fetch("/api/visits?hit=" + hit).then(r => r.ok ? r.json() : null).then(d => {
    if (d && typeof d.count === "number") { VISITS = d.count; showVisits(); }
  }).catch(() => {});
}

// Ad slots: one under the proof, a multiplex unit above the footer (never over the figure). build.mjs puts each
// AdSense unit in only once site.config.json has its ID; each is filled once per page load and not on the policy pages.
function showAd(r) {
  for (const el of document.querySelectorAll("aside.ad")) {
    const ins = el.querySelector("ins");
    el.hidden = !ins || LEGAL.includes(r);
    if (el.hidden || ins.dataset.pushed) continue;
    ins.dataset.pushed = "1";
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  }
}

function mountPage(name) {
  if (!PAGES[LANG]) {
    const want = LANG;
    loadScript(`/pages/${LANG}.js`).then(() => { if (LANG === want && routeOf(location.pathname) === name) route(); }, () => {});
    return;
  }
  view.innerHTML = pageHTML(T, PAGES[LANG], name, CFG);
}

function mountHome(keep) {
  if (!keep) view.innerHTML = homeHTML(T, window.LAB || []);
}
function mountLab(slug, keep) {
  if (!keep) view.innerHTML = labHTML(T, slug);
  const frame = view.querySelector("#lesson");
  view.querySelector("#full").onclick = () => { if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {}); };
  // The lesson's own "目录" link points at ./index.html; send it to this subject on the home page instead.
  const hook = () => {
    try {
      frame.contentDocument.addEventListener("click", e => {
        if (!e.target.closest || !e.target.closest("a.home")) return;
        e.preventDefault();
        navigate("home", "#" + labOf(slug)[1]);
      }, true);
    } catch (e) {}
  };
  frame.addEventListener("load", hook);
  if (frame.contentDocument && frame.contentDocument.readyState === "complete" && frame.contentDocument.URL !== "about:blank") hook();
}

function route() {
  if (teardown) { teardown(); teardown = null; }
  const r = routeOf(location.pathname) || "home";
  document.documentElement.dataset.view = r === "home" ? "home" : r.startsWith("lab/") ? "lab" : "book";
  // on the first draw, the pre-rendered view is still right if it is for this route and language
  const keep = view.dataset.r === r && document.documentElement.dataset.baked === LANG;
  delete view.dataset.r;
  if (r === "home") mountHome(keep);
  else if (r.startsWith("lab/")) mountLab(r.slice(4), keep);
  else if (r === "intro") mountIntro();
  else if (r === "sandbox") mountSandbox();
  else if (LEGAL.includes(r)) mountPage(r);
  else mountProp(+r.slice(1), keep);
  setHead(r);
  document.getElementById("foot").innerHTML = footHTML(T, r);
  nav.querySelectorAll("a").forEach(a => { if (a.dataset.r === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.querySelectorAll("#subjects .pill").forEach(a => { if (r.startsWith("lab/") ? a.dataset.s === labOf(r.slice(4))[1] : r !== "home" && a.dataset.s === "math") a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  sel.value = r;
  showAd(r);
}
// hash: a section of the home page (#phys …) to scroll to after drawing
function navigate(r, hash = "") {
  const url = pathFor(r) + location.search + hash;
  if (url !== location.pathname + location.search + location.hash) history.pushState(null, "", url);
  route();
  const el = hash && document.getElementById(hash.slice(1));
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}
// #p12, #intro, #sandbox from before the move to real addresses
function fromHash() {
  const h = location.hash.slice(1);
  const r = /^p\d+$/.test(h) ? routeOf("/p/" + h.slice(1)) : routeOf("/" + h);
  if (!h || !r) return false;
  history.replaceState(null, "", pathFor(r) + location.search);
  return true;
}

const scripts = {};
function loadScript(src) {
  return scripts[src] || (scripts[src] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res;
    s.onerror = () => { delete scripts[src]; rej(new Error(src)); };
    document.head.appendChild(s);
  }));
}
function loadLang(code) {
  return loadScript(`/i18n/${code}.js`).then(() => I18N[code] || Promise.reject(new Error(code)));
}
async function setLang(code, remember) {
  try { T = await loadLang(code); LANG = code; }
  catch (e) { if (code !== "zh") return setLang("zh", false); throw e; }
  langSel.value = LANG;
  if (remember) {
    try { localStorage.setItem("lang", LANG); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u); } catch (e) {}
  }
  buildChrome();
  route();
  document.documentElement.classList.remove("swap");
  // a home-page section (/#chem) may have been redrawn in another language after the browser jumped to it
  const el = location.hash && document.getElementById(location.hash.slice(1));
  if (el) el.scrollIntoView();
}

langSel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}" lang="${k}">${v}</option>`).join("");
langSel.onchange = () => setLang(langSel.value, true);
sel.onchange = () => navigate(sel.value);
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target || a.hasAttribute("download")) return;
  const u = new URL(a.href, location.href), r = routeOf(u.pathname);
  // other languages (?lang=xx) and outside links load normally
  if (u.origin !== location.origin || !r || (u.search && u.search !== location.search)) return;
  // a section on the page already shown: let the browser jump to it
  if (u.hash && u.pathname === location.pathname) return;
  e.preventDefault();
  navigate(r, u.hash);
});
addEventListener("popstate", route);
addEventListener("hashchange", () => { if (fromHash()) { route(); window.scrollTo(0, 0); } });
fromHash();
setLang(window.FIRST_LANG || "en", false);
loadVisits();
</script>
